# ==============================================================================
# EduHawk Website (eduhawk.in) — Production Nginx Configuration
# Fixes: Audit Sheet Issue (Row 15–31: Browser Caching "None")
# Optimizations: 1-Year Immutable Caching, Gzip Compression, SPA Fallback
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name eduhawk.in www.eduhawk.in;

    # Redirect HTTP to HTTPS
    return 301 https://www.eduhawk.in$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eduhawk.in;

    # SSL Certificates (managed by Certbot or Cloudflare)
    # ssl_certificate /etc/letsencrypt/live/eduhawk.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/eduhawk.in/privkey.pem;

    # 301 Redirect apex to www canonical
    return 301 https://www.eduhawk.in$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.eduhawk.in;

    root /var/www/eduhawk/dist;  # Path to your dist folder
    index index.html;

    # --------------------------------------------------------------------------
    # 1. Gzip Compression (Reduces JS/CSS download size by ~70%)
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # --------------------------------------------------------------------------
    # 2. Hashed Static Assets (Vite /assets/*)
    # FIX: Browser Caching "None" -> Sets 1 Year Max-Age Immutable Cache
    # --------------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # 3. Media & Fonts (Images, WebP, SVG, Favicon, Fonts, PDFs)
    # --------------------------------------------------------------------------
    location ~* \.(?:ico|png|jpg|jpeg|webp|gif|svg|woff|woff2|ttf|eot|pdf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # 4. Sitemap & Robots
    # --------------------------------------------------------------------------
    location = /sitemap.xml {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /robots.txt {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # --------------------------------------------------------------------------
    # 5. HTML & SPA Fallback (Never cache index.html so users get latest updates)
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # --------------------------------------------------------------------------
    # 6. Security Headers
    # --------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
