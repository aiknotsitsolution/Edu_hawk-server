              - { label: "Testimonial Text", name: "text", widget: "text" }
              - { label: "Rating Stars (1-5)", name: "stars", widget: "number", value_type: "int", min: 1, max: 5 }
          - label: "FAQ Section"
            name: "faq"
            widget: "object"
            fields:
              - { label: "FAQ Title", name: "title", widget: "string" }
              - { label: "FAQ Subtitle", name: "subtitle", widget: "string" }
              - { label: "Sidebar Tagline", name: "sidebarHeading", widget: "text" }
              - { label: "Sidebar Illustration Image", name: "sidebarImage", widget: "image", required: false }
              - label: "Questions & Answers"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Question", name: "question", widget: "string" }
                  - { label: "Answer", name: "answer", widget: "text" }

