  # ============================================================
  # 5. TESTS & ONLINE EXAMS (COMMON FOR ALL COUNTRIES)
  # ============================================================
  - name: "tests_exams"
    label: "Tests & Online Exams (Common)"
    folder: "src/data/common/tests"
    create: true
    delete: true
    slug: "{{slug}}"
    media_folder: "public/uploads/tests"
    public_folder: "/uploads/tests"
    fields:
      - { label: "Exam Name (e.g. IELTS, TOEFL, GRE, NEET)", name: "title", widget: "string" }
      - { label: "Exam Category", name: "category", widget: "select", options: ["English Online Exam", "Foreign Online Exam", "Entrance & Academic Tests"] }
      - { label: "Target Countries", name: "countries", widget: "list", default: ["USA", "UK", "Canada", "Australia", "Germany"] }
      - { label: "Exam Format / Mode", name: "format", widget: "string" }
      - { label: "Minimum Score / Cutoff", name: "score_needed", widget: "string" }
      - { label: "Fees / Exam Registration Cost", name: "fee", widget: "string" }
      - { label: "Exam Logo / Banner", name: "image", widget: "image", required: false }
      - { label: "Overview & Syllabus", name: "overview", widget: "markdown" }
      - { label: "Preparation Guidance & Tips", name: "preparation", widget: "markdown" }
      - { label: "Official Booking Link / CTA", name: "official_link", widget: "string" }
