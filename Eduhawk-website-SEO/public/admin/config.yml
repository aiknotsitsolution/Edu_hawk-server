backend:
  name: github
  repo: aiknotsitsolution/Edu_hawk-server
  branch: main

local_backend: true

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  # ============================================================
  # 1. MAIN PAGES
  # ============================================================
  - name: "main_pages"
    label: "Main Pages"
    delete: false
    files:
      - label: "Home Page"
        name: "home"
        file: "src/data/home.json"
        media_folder: "public/uploads/home"
        public_folder: "/uploads/home"
        fields:
          - label: "SEO Metadata"
            name: "seo"
            widget: "object"
            fields:
              - { label: "Page Title", name: "title", widget: "string" }
              - { label: "Meta Description", name: "description", widget: "text" }
          - label: "Hero Carousel Slides"
            name: "heroSlides"
            widget: "list"
            fields:
              - { label: "Slide ID", name: "id", widget: "number", value_type: "int" }
              - { label: "Slide Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "text" }
              - { label: "Button CTA", name: "cta", widget: "string" }
              - { label: "Slide Image", name: "image", widget: "image", required: false }
          - label: "Key Statistics (Stats Bar)"
            name: "stats"
            widget: "list"
            fields:
              - { label: "Value (e.g. 1000+)", name: "n", widget: "string" }
              - { label: "Label (e.g. Students Placed Globally)", name: "l", widget: "string" }
          - label: "MBBS Countries & Fees"
            name: "countries"
            widget: "list"
            collapsed: true
            summary: "{{fields.flag}} {{fields.name}} - {{fields.fee}}"
            fields:
              - { label: "Country Name", name: "name", widget: "string" }
              - { label: "Flag Emoji", name: "flag", widget: "string" }
              - { label: "Available Seats", name: "seats", widget: "string" }
              - { label: "Package Fee", name: "fee", widget: "string" }
              - { label: "Page Link", name: "link", widget: "string", required: false }
              - { label: "Highlight Tag", name: "tag", widget: "string", required: false }
          - label: "MBBS Country Packages & Options"
            name: "mbbsOptions"
            widget: "list"
            collapsed: true
            summary: "{{fields.country}} - {{fields.fees}}"
            fields:
              - { label: "Country", name: "country", widget: "string" }
              - { label: "Fee Range", name: "fees", widget: "string" }
              - { label: "Page Link", name: "link", widget: "string" }
          - label: "Student Testimonials"
            name: "testimonials"
            widget: "list"
            collapsed: true
            summary: "{{fields.name}} ({{fields.loc}}) - {{fields.stars}} Stars"
            fields:
              - { label: "Student Name", name: "name", widget: "string" }
              - { label: "Location / Country", name: "loc", widget: "string" }
              - { label: "University Name", name: "university", widget: "string", required: false }
              - { label: "Testimonial Text", name: "text", widget: "text" }
              - { label: "Rating Stars (1-5)", name: "stars", widget: "number", value_type: "int", min: 1, max: 5 }
          - label: "Frequently Asked Questions"
            name: "faq"
            widget: "list"
            fields:
              - { label: "Question", name: "question", widget: "string" }
              - { label: "Answer", name: "answer", widget: "text" }

      - label: "About Page"
        name: "about"
        file: "src/data/about.json"
        media_folder: "public/uploads/about"
        public_folder: "/uploads/about"
        fields:
          - label: "SEO Metadata"
            name: "seo"
            widget: "object"
            fields:
              - { label: "Page Title", name: "title", widget: "string" }
              - { label: "Meta Description", name: "description", widget: "text" }
          - label: "Hero Carousel Slides"
            name: "heroSlides"
            widget: "list"
            fields:
              - { label: "Slide ID", name: "id", widget: "number", value_type: "int" }
              - { label: "Slide Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "text" }
              - { label: "Button CTA", name: "cta", widget: "string" }
              - { label: "Slide Image", name: "image", widget: "image", required: false }
          - label: "Key Statistics (Stats Bar)"
            name: "stats"
            widget: "list"
            fields:
              - { label: "Value (e.g. 1000+)", name: "n", widget: "string" }
              - { label: "Label (e.g. Students Placed Globally)", name: "l", widget: "string" }
          - label: "Welcome Section"
            name: "welcome"
            widget: "object"
            fields:
              - { label: "Top Badge", name: "badge", widget: "string" }
              - { label: "Main Heading", name: "title", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "string" }
              - { label: "Welcome Section Image", name: "image", widget: "image", required: false }
              - { label: "Paragraph 1 (Before Link)", name: "p1_before", widget: "text" }
              - { label: "Paragraph 1 (Link Text)", name: "p1_link_text", widget: "string" }
              - { label: "Paragraph 2", name: "p2", widget: "text" }
              - { label: "Paragraph 3", name: "p3", widget: "text" }
              - { label: "Button Text", name: "ctaText", widget: "string" }
              - { label: "Quote", name: "quote", widget: "string" }
          - label: "Call-to-Action Banner"
            name: "banner"
            widget: "object"
            fields:
              - { label: "Banner Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "string" }
              - { label: "Banner Background Image", name: "backgroundImage", widget: "image", required: false }
              - { label: "Button Text", name: "ctaText", widget: "string" }
              - { label: "WhatsApp Phone Number", name: "whatsappPhone", widget: "string" }
          - label: "Countries & Fees"
            name: "countries"
            widget: "list"
            fields:
              - { label: "Country Name", name: "name", widget: "string" }
              - { label: "Flag Emoji", name: "flag", widget: "string" }
