<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Preconnect to the third-party origins used at runtime (analytics/ads).
         These are connection warm-ups only; they do not fetch anything, so they
         add no payload and cannot cause layout shift. -->
    <link rel="preconnect" href="https://www.googletagmanager.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.google-analytics.com" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://www.gstatic.com https://challenges.cloudflare.com https://cdnjs.cloudflare.com https://www.cloudflare.com https://static.cloudflareinsights.com https://ad.doubleclick.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; connect-src 'self' https://edu-hawk-server.onrender.com https://www.google-analytics.com https://www.googletagmanager.com https://www.google.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://challenges.cloudflare.com https://www.cloudflare.com https://ad.doubleclick.net; frame-src 'self' https://www.google.com https://www.googletagmanager.com https://www.youtube.com https://www.facebook.com https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self' https://edu-hawk-server.onrender.com; upgrade-insecure-requests; block-all-mixed-content"
    />

    <!--
      Page-level SEO metadata (title, description, canonical, OG, Twitter, robots)
      is injected per-route by src/component/SeoHead.jsx via react-helmet-async.
      Static homepage metadata was intentionally removed here (Phase 2) so that
      unrelated routes no longer inherit homepage metadata.

      TODO (Phase 4, pending management decision): canonical site origin
      (eduhawk.in vs www.eduhawk.in) is configured in src/component/SeoHead.jsx.
    -->

    <!-- Additional Meta Tags -->
    <meta name="theme-color" content="#02145a" />
    <meta name="msapplication-TileColor" content="#02145a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google tag (gtag.js) + Google Tag Manager.
         These are loaded AFTER the page becomes idle so their network fetch and
         execution no longer block first paint or the main thread (TBT).
         `dataLayer` and `gtag()` are defined immediately, so any early event is
         queued exactly as before — tracking behaviour is unchanged. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "AW-16526668697");

      (function deferTagManager() {
        function loadTags() {
          // gtag.js (Google Ads)
          var g = document.createElement("script");
          g.async = true;
          g.src = "https://www.googletagmanager.com/gtag/js?id=AW-16526668697";
          document.head.appendChild(g);

          // GTM
          window.dataLayer.push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
          var j = document.createElement("script");
          j.async = true;
          j.src = "https://www.googletagmanager.com/gtm.js?id=GTM-M3DW5X72";
          document.head.appendChild(j);
        }
        if ("requestIdleCallback" in window) {
          window.requestIdleCallback(loadTags, { timeout: 3000 });
        } else {
          window.addEventListener("load", function () {
            setTimeout(loadTags, 0);
          });
        }
      })();
    </script>
  </head>

  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript>
      <iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-M3DW5X72"
        height="0"
        width="0"
        class="gtm-noscript-frame"
      ></iframe>
    </noscript>
    <!-- End Google Tag Manager (noscript) -->

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
